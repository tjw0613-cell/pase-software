name: Tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build release artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and test the wheel
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest --import-mode=importlib --junitxml=verification/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: verification/tests.xml
  documentation-and-tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs,tutorial]'
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python scripts/check_docs.py docs/_build/html
      - run: python scripts/run_tutorial.py --output tutorial-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-and-tutorial
          path: |
            docs/_build/html
            tutorial-output

